# Shared parameters for the m1_control nodes.
# Loaded by the launch files; edit here rather than in the launch scripts.

control_arbiter_node:
  ros__parameters:
    watchdog_timeout_sec: 0.35
    # Cap on what ANY source may command, not just the keyboard. Raised from
    # 0.25 because 0.25 m/s was slower than the operator wanted to drive. The
    # console asks for 0.32; if this stayed at 0.25 the request would be
    # clamped on arrival and the speed would not change at all - which is a
    # silent failure, since the console has no way to see the clamp.
    max_linear_x: 0.35
    max_linear_y: 0.20
    max_angular_z: 0.80

    # Servo rest pose. Axis mapping verified by hand (direction only):
    #   s1 = TILT  larger = look UP     (0 down-angled, 30 level, 70 up)
    #   s2 = PAN   larger = look LEFT   (60 right, 90 centre, 120 left)
    # Confirmed working:
    #   ros2 topic pub --once /Servo yahboomcar_msgs/msg/ServoControl "{s1: 40, s2: 90}"
    # Ranges are the vendor joystick limits, NOT checked against mechanical stops.
    # Servo limits are SYMMETRIC about the rest pose, measured on the robot by
    # moving the head and watching for image change in the camera (which sits
    # on the head). Asymmetric limits are what made the head travel much
    # further one way than the other.
    #
    #   s1 = TILT, centre 40.  Measured usable 0..90; +-35 is conservative.
    #   s2 = PAN,  centre 90.  The vendor driver hard-clamps s2 to 0..110, so
    #                          the widest symmetric travel is 70..110 (+-20),
    #                          but we narrow it to 80..100 (+-10) so the camera
    #                          keeps the path ahead in view while driving.
    servo_s1_min: 5
    servo_s1_max: 75
    servo_s2_min: 80
    servo_s2_max: 100

    initial_mode: 1            # 1 = KEYBOARD
    publish_rate_hz: 20.0

    # Keyboard works in EVERY mode. A non-zero keyboard command wins for this
    # long, then the active mode resumes on its own. Safe because a keyboard
    # command needs a human holding a key - unlike an EEG gesture, it cannot
    # arrive by accident.
    keyboard_override: true
    keyboard_override_sec: 0.4

    # Beep on mode change. OFF by default: the buzzer latches on the chassis
    # driver (true -> set_beep(1), false -> set_beep(0)), so a beep that is not
    # explicitly turned off sounds forever. The arbiter now pulses on/off, but
    # the feature is not worth the risk during normal operation.
    beep_on_mode_change: false

wasd_teleop_node:
  ros__parameters:
    speed_trans: 0.20
    speed_strafe: 0.20
    speed_rot: 0.60
    servo_step: 5.0
    # s1 = TILT (larger = up), s2 = PAN (larger = left)
    servo_s1_center: 40.0
    servo_s2_center: 90.0
    # Symmetric about centre - see the note in control_arbiter_node above.
    servo_s1_min: 5.0
    servo_s1_max: 75.0
    servo_s2_min: 80.0
    servo_s2_max: 100.0
    hold_time_sec: 0.25
    publish_rate_hz: 20.0

eeg_udp_bridge:
  # Tuned on the command line / launch `arguments`, not here: the bridge parses
  # its own argparse options (--speed, --steer, --link-timeout, ...) before ROS
  # starts, so it stays runnable standalone for `--dry-run` testing.
  ros__parameters: {}

image_throttle_node:
  ros__parameters:
    input_topic: /image_raw/compressed
    output_topic: /image_throttled/compressed
    target_rate_hz: 20.0

gaze_control_node:
  ros__parameters:
    # PTZ aiming is POSITIONAL: the gaze offset maps to an absolute angle, so
    # the head stops where your eyes stop and returns when you look back to
    # centre. (An integrating version ran away to the travel limit.)
    #
    # Total degrees of travel used across the deadzone radius. Lower = calmer
    # and finer; raise if the head does not follow far enough.
    servo_pan_span: 10.0
    servo_tilt_span: 20.0
    # Low-pass per tick: 1.0 = instant/jittery, 0.2 = very smooth/laggy.
    servo_smoothing: 0.35

    dwell_time_sec: 0.40
    deadzone_radius_ratio: 0.25
    enable_strafe: true
    gaze_link_timeout_sec: 0.6

    drive_speed_x: 0.20
    drive_speed_y: 0.20
    turn_speed_z: 0.60

    # s1 = TILT (larger = up), s2 = PAN (larger = left)
    servo_s1_center: 40.0
    servo_s2_center: 90.0
    # Symmetric about centre - see the note in control_arbiter_node above.
    servo_s1_min: 5.0
    servo_s1_max: 75.0
    servo_s2_min: 80.0
    servo_s2_max: 100.0

    # Never claim the mode automatically; the operator decides.
    assert_mode: false
