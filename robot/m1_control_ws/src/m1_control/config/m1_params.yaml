# Shared parameters for the m1_control nodes.
# Loaded by the launch files; edit here rather than in the launch scripts.

control_arbiter_node:
  ros__parameters:
    watchdog_timeout_sec: 0.35
    max_linear_x: 0.25
    max_linear_y: 0.20
    max_angular_z: 0.80

    # Servo rest pose. Axis mapping verified by hand (direction only):
    #   s1 = TILT  larger = look UP     (0 down-angled, 30 level, 70 up)
    #   s2 = PAN   larger = look LEFT   (60 right, 90 centre, 120 left)
    # Confirmed working:
    #   ros2 topic pub --once /Servo yahboomcar_msgs/msg/ServoControl "{s1: 40, s2: 90}"
    # Ranges are the vendor joystick limits, NOT checked against mechanical stops.
    default_servo_s1: 40
    default_servo_s2: 90
    servo_s1_min: 0
    servo_s1_max: 180
    servo_s2_min: 0
    servo_s2_max: 110          # driver hard-clamps s2 to 0..110

    initial_mode: 1            # 1 = KEYBOARD
    publish_rate_hz: 20.0
    # Beep on mode change. OFF by default: the buzzer latches on the chassis
    # driver (true -> set_beep(1), false -> set_beep(0)), so a beep that is not
    # explicitly turned off sounds forever. The arbiter now pulses on/off, but
    # the feature is not worth the risk during normal operation.
    beep_on_mode_change: false

wasd_teleop_node:
  ros__parameters:
    speed_trans: 0.20
    speed_strafe: 0.20
    speed_rot: 0.60
    servo_step: 5.0
    # s1 = TILT (larger = up), s2 = PAN (larger = left)
    servo_s1_center: 40.0
    servo_s2_center: 90.0
    servo_s1_min: 0.0
    servo_s1_max: 180.0
    servo_s2_min: 0.0
    servo_s2_max: 110.0
    hold_time_sec: 0.25
    publish_rate_hz: 20.0

eeg_udp_bridge:
  # Tuned on the command line / launch `arguments`, not here: the bridge parses
  # its own argparse options (--speed, --steer, --link-timeout, ...) before ROS
  # starts, so it stays runnable standalone for `--dry-run` testing.
  ros__parameters: {}

image_throttle_node:
  ros__parameters:
    input_topic: /image_raw/compressed
    output_topic: /image_throttled/compressed
    target_rate_hz: 20.0
